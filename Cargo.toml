[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["almanacs/renovate"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "ISC"
repository = "https://github.com/ivy/almanac"
publish = false

[workspace.dependencies]
almanac = { path = "crates/almanac" }
almanac-macros = { path = "crates/macros" }
github = { path = "crates/github" }
axum = "0.8"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simforge = { path = "crates/simforge" }
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
toml = "0.8"
trybuild = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
