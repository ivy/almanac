[package]
name = "almanac-renovate"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
advisory = { path = "../../crates/advisory" }
almanac = { path = "../../crates/almanac" }
futures = "0.3"
claude = { path = "../../crates/claude" }
github = { path = "../../crates/github" }
registry = { path = "../../crates/registry" }
sandbox = { path = "../../crates/sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["rt"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[dev-dependencies]
axum = "0.8"
deliveries = { path = "../../crates/deliveries" }
flate2 = "1"
insta = { version = "1", features = ["json"] }
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tar = "0.4"
reqwest = { version = "0.13", default-features = false }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
simforge = { path = "../../crates/simforge" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
