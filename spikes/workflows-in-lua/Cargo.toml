[package]
name = "workflows-in-lua"
version = "0.0.0"
edition = "2024"
license = "ISC"
publish = false

[workspace]

[dependencies]
almanac = { path = "../../crates/almanac" }
almanac-renovate = { path = "../../almanacs/renovate" }
futures = "0.3"
github = { path = "../../crates/github" }
mlua = { version = "0.12", features = ["luau", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
simforge = { path = "../../crates/simforge" }
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
